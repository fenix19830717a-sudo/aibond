[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aibond-mcp"
version = "1.3.0"
description = "aibond MCP Server - 企业级人机协同平台 MCP 接口"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "aibond", email = "aibond@aib2b.bond"}
]
keywords = ["mcp", "agent", "workflow", "multi-agent", "ai", "collaboration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://aib2b.bond"
Repository = "https://github.com/fenix19830717a-sudo/aibond"
Documentation = "https://github.com/fenix19830717a-sudo/aibond#readme"